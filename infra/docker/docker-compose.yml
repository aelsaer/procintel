
services:
  postgres:
    image: postgis/postgis:16-3.4
    # Analytical aggregates and concurrent tenant scoring use PostgreSQL
    # dynamic shared memory. Docker's 64 MiB default is too small for the
    # real June dataset and can surface as an intermittent API 500.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-procintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procintel}
      POSTGRES_DB: ${POSTGRES_DB:-procintel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - procintel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-procintel} -d ${POSTGRES_DB:-procintel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
    volumes:
      - procintel_keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 15

  keycloak-workspace-bootstrap:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-procintel}
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-procintel}
      - -d
      - ${POSTGRES_DB:-procintel}
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "INSERT INTO tenants (id, name, plan) VALUES ('${PROCINTEL_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000101}', 'Procintel Local Workspace', 'PROFESSIONAL') ON CONFLICT (id) DO NOTHING"
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      keycloak-workspace-bootstrap:
        condition: service_completed_successfully
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-procintel-admin-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      PROCINTEL_WEB_ORIGIN: ${PROCINTEL_WEB_ORIGIN:-http://localhost:3000}
      PROCINTEL_WEB_ORIGIN_ALT: ${PROCINTEL_WEB_ORIGIN_ALT:-http://127.0.0.1:3000}
      PROCINTEL_DEFAULT_TENANT_ID: ${PROCINTEL_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000101}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    mem_limit: 1g

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      # Dev-only: disables the security plugin (TLS/auth) so local
      # development doesn't need a certificate/admin-password dance.
      # Never do this in production — use a real OPENSEARCH_URL with
      # security enabled there instead.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - procintel_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-procintel}:${POSTGRES_PASSWORD:-procintel}@postgres:5432/${POSTGRES_DB:-procintel}
      OPENSEARCH_URL: ${API_OPENSEARCH_URL:-http://opensearch:9200}
      PROCINTEL_DEV_AUTH: ${PROCINTEL_DEV_AUTH:-true}
      PROCINTEL_DEV_EMAIL: ${PROCINTEL_DEV_EMAIL:-owner@procintel.local}
      PROCINTEL_DEV_TENANT_ID: ${PROCINTEL_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000101}
      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/procintel
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-procintel-api}
      # Tokens retain the browser-facing localhost issuer while the API
      # fetches signing keys through Docker's internal Keycloak hostname.
      OIDC_JWKS_URL: http://keycloak:8080/realms/procintel/protocol/openid-connect/certs
      RAW_STORE_ROOT: /var/lib/procintel/raw
      DOCUMENT_STORE_ROOT: /var/lib/procintel/documents
      EXPORT_ROOT: /var/lib/procintel/exports
      GEMI_API_BASE_URL: ${GEMI_API_BASE_URL:-https://opendata-api.businessportal.gr/api/opendata/v1}
      GEMI_API_KEY: ${GEMI_API_KEY:-}
      GEMI_RATE_LIMIT_PER_MINUTE: ${GEMI_RATE_LIMIT_PER_MINUTE:-8}
      GEMI_MAX_RETRY_ATTEMPTS: ${GEMI_MAX_RETRY_ATTEMPTS:-3}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - procintel_raw_data:/var/lib/procintel/raw
      - procintel_document_data:/var/lib/procintel/documents
      - procintel_export_data:/var/lib/procintel/exports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        API_BASE_URL: http://api:8000
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/procintel
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-procintel-web}
      OIDC_REDIRECT_URI: http://localhost:${WEB_PORT:-3000}/callback
    ports:
      - "${WEB_PORT:-3000}:3000"

  ingestion-scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.scheduler
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    command:
      - python
      - -m
      - services.ingestion.orchestration.cli
      - run-daily
      - --at
      - ${DAILY_INGEST_AT:-02:30}
      - --timezone
      - ${DAILY_INGEST_TIMEZONE:-Europe/Athens}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-procintel}:${POSTGRES_PASSWORD:-procintel}@postgres:5432/${POSTGRES_DB:-procintel}
      RAW_STORE_ROOT: /var/lib/procintel/raw
      DOCUMENT_STORE_ROOT: /var/lib/procintel/documents
      # Container-to-container URL. Kept separate from the host-facing
      # OPENSEARCH_URL commonly set to localhost:9200 in this directory.
      OPENSEARCH_URL: ${SCHEDULER_OPENSEARCH_URL:-http://opensearch:9200}
      DAILY_INGEST_LOOKBACK_DAYS: ${DAILY_INGEST_LOOKBACK_DAYS:-3}
      DAILY_INGEST_MIN_INTERVAL_HOURS: ${DAILY_INGEST_MIN_INTERVAL_HOURS:-23}
      DAILY_GEOSPATIAL_MAX_JOBS: ${DAILY_GEOSPATIAL_MAX_JOBS:-12000}
      DAILY_SCORING_LOOKBACK_DAYS: ${DAILY_SCORING_LOOKBACK_DAYS:-120}
      DAILY_DIAVGEIA_MAX_LOOKUPS: ${DAILY_DIAVGEIA_MAX_LOOKUPS:-1000}
      DAILY_GEMI_MAX_LOOKUPS: ${DAILY_GEMI_MAX_LOOKUPS:-500}
      DAILY_MEF_MAX_LOOKUPS: ${DAILY_MEF_MAX_LOOKUPS:-500}
      DAILY_ANAPTYXI_MAX_LOOKUPS_PER_PERIOD: ${DAILY_ANAPTYXI_MAX_LOOKUPS_PER_PERIOD:-500}
      DAILY_VIES_MAX_LOOKUPS: ${DAILY_VIES_MAX_LOOKUPS:-500}
      DAILY_DOCUMENT_MAX_DOWNLOADS: ${DAILY_DOCUMENT_MAX_DOWNLOADS:-10000}
      DAILY_ADAMCHAIN_MAX_LOOKUPS: ${DAILY_ADAMCHAIN_MAX_LOOKUPS:-12000}
      DAILY_ENRICHMENT_MAX_JOBS: ${DAILY_ENRICHMENT_MAX_JOBS:-30000}
      KHMDHS_API_BASE_URL: ${KHMDHS_API_BASE_URL:-https://cerpp.eprocurement.gov.gr}
      KHMDHS_RATE_LIMIT_PER_MINUTE: ${KHMDHS_RATE_LIMIT_PER_MINUTE:-180}
      TED_API_BASE_URL: ${TED_API_BASE_URL:-https://api.ted.europa.eu}
      TED_RATE_LIMIT_PER_MINUTE: ${TED_RATE_LIMIT_PER_MINUTE:-60}
      TED_BENCHMARK_COUNTRIES: ${TED_BENCHMARK_COUNTRIES:-AT,BE,BG,HR,CY,CZ,DE,DK,EE,ES,FI,FR,GR,HU,IE,IT,LT,LU,LV,MT,NL,PL,PT,RO,SE,SI,SK}
      TED_COUNTRIES_PER_CYCLE: ${TED_COUNTRIES_PER_CYCLE:-5}
      TED_DAILY_LOOKBACK_DAYS: ${TED_DAILY_LOOKBACK_DAYS:-9}
      TED_BENCHMARK_LOOKBACK_DAYS: ${TED_BENCHMARK_LOOKBACK_DAYS:-365}
      DIAVGEIA_API_BASE_URL: ${DIAVGEIA_API_BASE_URL:-https://diavgeia.gov.gr/opendata}
      DIAVGEIA_RATE_LIMIT_PER_MINUTE: ${DIAVGEIA_RATE_LIMIT_PER_MINUTE:-60}
      GEMI_API_BASE_URL: ${GEMI_API_BASE_URL:-https://opendata-api.businessportal.gr/api/opendata/v1}
      GEMI_API_KEY: ${GEMI_API_KEY:-}
      GEMI_RATE_LIMIT_PER_MINUTE: ${GEMI_RATE_LIMIT_PER_MINUTE:-8}
      GEMI_MAX_RETRY_ATTEMPTS: ${GEMI_MAX_RETRY_ATTEMPTS:-3}
      MEF_API_BASE_URL: ${MEF_API_BASE_URL:-https://mef.diavgeia.gov.gr}
      MEF_RATE_LIMIT_PER_MINUTE: ${MEF_RATE_LIMIT_PER_MINUTE:-60}
      MEF_MAX_RETRY_ATTEMPTS: ${MEF_MAX_RETRY_ATTEMPTS:-2}
      MEF_REQUEST_TIMEOUT_SECONDS: ${MEF_REQUEST_TIMEOUT_SECONDS:-10}
      CKAN_API_BASE_URL: ${CKAN_API_BASE_URL:-https://data.gov.gr}
      CKAN_RATE_LIMIT_PER_MINUTE: ${CKAN_RATE_LIMIT_PER_MINUTE:-60}
      INSPIRE_KTIMATOLOGIO_WMS_URL: ${INSPIRE_KTIMATOLOGIO_WMS_URL:-https://gis.ktimanet.gr/inspire/rest/services/cadastralparcels/CadastralParcelWMS/MapServer/exts/InspireView/service}
      INSPIRE_GREEK_CSW_URL: ${INSPIRE_GREEK_CSW_URL:-http://geoportal.ypen.gr/geonetwork/srv/eng/csw}
      INSPIRE_CSW_MAX_RECORDS: ${INSPIRE_CSW_MAX_RECORDS:-200}
      INSPIRE_CSW_MAX_SERVICE_CHECKS: ${INSPIRE_CSW_MAX_SERVICE_CHECKS:-40}
      INSPIRE_BLOCKED_RETRY_DAYS: ${INSPIRE_BLOCKED_RETRY_DAYS:-30}
      INSPIRE_GREECE_NUTS_URL: ${INSPIRE_GREECE_NUTS_URL:-https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_03M_2024_4326.geojson}
      INSPIRE_GREECE_POSTAL_NUTS_URL: ${INSPIRE_GREECE_POSTAL_NUTS_URL:-https://gisco-services.ec.europa.eu/tercet/NUTS-2024/pc2025_EL_NUTS-2024_v1.0.zip}
      ANAPTYXI_2007_2013_API_BASE_URL: ${ANAPTYXI_2007_2013_API_BASE_URL:-}
      ANAPTYXI_2014_2020_API_BASE_URL: ${ANAPTYXI_2014_2020_API_BASE_URL:-}
      ANAPTYXI_2021_2027_API_BASE_URL: ${ANAPTYXI_2021_2027_API_BASE_URL:-}
      ANAPTYXI_RATE_LIMIT_PER_MINUTE: ${ANAPTYXI_RATE_LIMIT_PER_MINUTE:-60}
      VIES_API_BASE_URL: ${VIES_API_BASE_URL:-https://ec.europa.eu/taxation_customs/vies/services}
      VIES_RATE_LIMIT_PER_MINUTE: ${VIES_RATE_LIMIT_PER_MINUTE:-60}
      GEO_GEOCODER_BASE_URL: ${GEO_GEOCODER_BASE_URL:-}
      GEO_GEOCODER_USER_AGENT: ${GEO_GEOCODER_USER_AGENT:-}
      GEO_GEOCODER_RATE_LIMIT_PER_MINUTE: ${GEO_GEOCODER_RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - procintel_raw_data:/var/lib/procintel/raw
      - procintel_document_data:/var/lib/procintel/documents

volumes:
  procintel_postgres_data:
  procintel_keycloak_postgres_data:
  procintel_opensearch_data:
  procintel_raw_data:
  procintel_document_data:
  procintel_export_data:

# Redis and MinIO are intentionally still not included — this compose file
# covers the local API, database, identity provider, search index and
# persistent daily ingestion runner.
